<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akane</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-composer-open="true">
  <main class="shell">
    <!-- Character art — swap src for your transparent PNG -->
    <div class="character-wrap" id="characterWrap">
      <img
        class="character-art"
        id="characterArt"
        src="../../../images/Vtuber_model.png"
        alt=""
        onerror="this.onerror=null;this.src='../../../images/Vtuber_model.png';"
      />
      <div class="avatar-hitbox" id="avatarHitbox" aria-hidden="true"></div>
      <div class="avatar-action-dock" aria-label="Akane actions">
        <button class="avatar-action-btn avatar-action-btn-small avatar-action-btn-memory" id="memoryActionButton" type="button" aria-label="Show memory"></button>
        <button class="avatar-action-btn avatar-action-btn-message" id="messageActionButton" type="button" aria-label="Open chat input" title="Open chat input · Right-click to read responses (Option+↑)" aria-keyshortcuts="Alt+ArrowUp"></button>
        <button class="avatar-action-btn avatar-action-btn-small avatar-action-btn-minimize" id="minimizeButton" type="button" aria-label="Minimize"></button>
        <button class="avatar-action-btn avatar-action-btn-small avatar-action-btn-close" id="closeButton" type="button" aria-label="Close"></button>
      </div>
    </div>

    <section class="dialogue-panel" id="dialoguePanel" aria-label="Akane's response" hidden>
      <div class="dialogue-toolbar">
        <button id="dialoguePrevious" type="button" aria-label="Previous response">‹</button>
        <button id="dialogueNext" type="button" aria-label="Next response">›</button>
        <button id="dialogueLatest" type="button" aria-label="Jump to latest text" hidden>↓</button>
        <button id="dialogueExpand" type="button" aria-label="Open complete response" aria-expanded="false" aria-controls="responsePanel">↗</button>
        <button id="dialogueDismiss" type="button" aria-label="Dismiss response">×</button>
      </div>
      <div class="dialogue-open" id="dialogueOpen" role="region" tabindex="0" aria-label="Akane's response, scroll to read; Enter opens complete response">
        <span class="dialogue-text" id="dialogueText" aria-live="polite" aria-atomic="true"></span>
      </div>
    </section>

    <!-- Composer bar -->
    <form class="composer" id="composer">
      <label class="sr-only" for="messageInput">Ask Akane</label>
      <textarea
        id="messageInput"
        rows="1"
        placeholder="Talk to Akane…"
        autocomplete="off"
      ></textarea>
      <button class="composer-send" id="sendButton" type="submit" aria-label="Send"></button>
    </form>

    <p class="notice" id="notice" hidden></p>

  </main>
  <section class="response-panel" id="responsePanel" role="region" aria-label="Complete responses" hidden>
    <div class="response-header">
      <button id="responsePrevious" type="button" aria-label="Previous response">‹</button>
      <span id="responsePosition"></span>
      <button id="responseNext" type="button" aria-label="Next response">›</button>
      <button id="responseClose" type="button" aria-label="Close complete response">×</button>
    </div>
    <div class="response-content" id="responseContent" tabindex="0"></div>
    <p class="response-hint">Close to resume</p>
  </section>
  <div class="memory-panel" id="memoryPanel" hidden>
    <div class="memory-header">
      <h3>Model Memory</h3>
      <button class="memory-close-btn" id="memoryCloseBtn" type="button" aria-label="Close memory panel">✕</button>
    </div>
    <div class="memory-content" id="memoryContent">
      <div class="memory-loading">Loading memory...</div>
    </div>
  </div>
  <template id="emptyState">
    <div class="empty-state" aria-hidden="true"></div>
  </template>
  <script src="subtitles.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
